# dsh-sidebar-fold bundle patch
#
# Assembly layer for the DSH profiles whose bundle list includes this package.
# A pure ADDITION: one insert row carrying an id no shipped entry uses. No
# shipped row is disabled, renamed, or reconfigured here, so the patch stays
# safe to compose with any other plugin's patch.
#
# The row exists so the loader has a host-side entry point (src/index.js, which
# installs nothing) and so the bundle's settings namespace is served under this
# package's name; every behaviour lives in the browser half (lib/client.js).
#
# Install (recommended, official CLI):
#   dsh plugin --profile <profile> add dsh-sidebar-fold

- insert:
    - id: dsh-sidebar-fold
      name: dsh-sidebar-fold
